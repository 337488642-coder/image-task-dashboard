<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>图片任务流转看板</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #333; }
.header { background: linear-gradient(135deg, #1a73e8, #4285f4); color: #fff; padding: 20px 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
.header h1 { font-size: 22px; font-weight: 600; }
.header .sub { font-size: 13px; opacity: 0.85; margin-top: 4px; }
.container { max-width: 1600px; margin: 0 auto; padding: 20px; }
/* 指标卡 */
.metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
.metric-card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); border-left: 4px solid #1a73e8; }
.metric-card.green { border-left-color: #34a853; }
.metric-card.orange { border-left-color: #fbbc04; }
.metric-card.red { border-left-color: #ea4335; }
.metric-label { font-size: 13px; color: #666; margin-bottom: 8px; }
.metric-value { font-size: 32px; font-weight: 700; color: #1a73e8; }
.metric-card.green .metric-value { color: #34a853; }
.metric-card.orange .metric-value { color: #f9a825; }
.metric-card.red .metric-value { color: #ea4335; }
/* 筛选区 */
.filter-bar { background: #fff; border-radius: 10px; padding: 16px 20px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
.filter-item { display: flex; flex-direction: column; gap: 4px; }
.filter-item label { font-size: 12px; color: #666; font-weight: 500; }
.filter-item input, .filter-item select { padding: 7px 10px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 13px; min-width: 140px; outline: none; }
.filter-item input:focus, .filter-item select:focus { border-color: #1a73e8; }
.filter-item select[multiple] { min-width: 180px; min-height: 80px; }
.btn { padding: 8px 18px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 500; }
.btn-primary { background: #1a73e8; color: #fff; }
.btn-primary:hover { background: #1557b0; }
.btn-default { background: #f5f5f5; color: #333; border: 1px solid #d9d9d9; }
.btn-default:hover { background: #e8e8e8; }
.filter-count { font-size: 13px; color: #1a73e8; font-weight: 600; margin-left: auto; align-self: center; }
.quick-date-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; }
.quick-btn { padding: 6px 14px; border: 1px solid #d9d9d9; border-radius: 16px; background: #fff; color: #555; font-size: 12px; cursor: pointer; transition: all 0.2s; }
.quick-btn:hover { border-color: #1a73e8; color: #1a73e8; }
.quick-btn.active { background: #1a73e8; color: #fff; border-color: #1a73e8; }
.date-sep { color: #ccc; font-size: 12px; }
.date-custom { font-size: 12px; color: #888; }
.quick-date-bar input[type="date"] { padding: 5px 8px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 12px; min-width: 130px; }
/* 图表区 */
.charts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 20px; }
.chart-card { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.chart-title { font-size: 14px; font-weight: 600; color: #333; margin-bottom: 10px; padding-left: 8px; border-left: 3px solid #1a73e8; }
.chart-container { width: 100%; height: 280px; }
/* 任务列表 */
.task-section { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.task-section-title { font-size: 16px; font-weight: 600; color: #333; margin-bottom: 16px; padding-left: 10px; border-left: 4px solid #1a73e8; display: flex; align-items: center; gap: 10px; }
.task-section-title .count { font-size: 13px; color: #999; font-weight: normal; }
.owner-group { margin-bottom: 12px; border: 1px solid #e8e8e8; border-radius: 8px; overflow: hidden; }
.owner-header { background: #f8f9fa; padding: 12px 16px; cursor: pointer; display: flex; align-items: center; gap: 10px; user-select: none; }
.owner-header:hover { background: #eef1f5; }
.owner-avatar { width: 32px; height: 32px; border-radius: 50%; background: #1a73e8; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
.owner-name { font-size: 14px; font-weight: 600; color: #333; }
.owner-task-count { font-size: 12px; color: #999; background: #e8e8e8; padding: 2px 8px; border-radius: 10px; }
.owner-toggle { margin-left: auto; font-size: 12px; color: #999; transition: transform 0.2s; }
.owner-group.collapsed .owner-toggle { transform: rotate(-90deg); }
.owner-group.collapsed .owner-tasks { display: none; }
.owner-tasks { padding: 0; }
.task-row { display: grid; grid-template-columns: 100px 1fr 80px 90px 100px 110px; gap: 12px; padding: 10px 16px; border-bottom: 1px solid #f0f0f0; align-items: center; font-size: 13px; }
.task-row:last-child { border-bottom: none; }
.task-row:hover { background: #fafbfc; }
.task-id { font-family: monospace; color: #1a73e8; font-weight: 500; }
.task-name { color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.meta-chip { display: inline-flex; align-items: center; max-width: 260px; font-size: 11px; line-height: 1.4; padding: 1px 7px; border-radius: 4px; background: #f0f2f5; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta-chip.shoot { background: #fff3e0; color: #e65100; }
.meta-chip.video { background: #f3e5f5; color: #6a1b9a; }
.meta-chip.attach { background: #e0f7fa; color: #00695c; }
a.meta-chip.attach { text-decoration: none; cursor: pointer; }
a.meta-chip.attach:hover { background: #b2ebf2; text-decoration: underline; }
.att-thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.att-thumb img { width: 54px; height: 54px; object-fit: cover; border-radius: 6px; border: 1px solid #d8dde3; cursor: zoom-in; display: block; transition: transform .15s; }
.att-thumb img:hover { transform: scale(1.08); border-color: #1a73e8; }
.task-remark { margin-top: 6px; font-size: 11.5px; line-height: 1.55; color: #444; background: #f6f8fa; border-left: 3px solid #1a73e8; border-radius: 0 4px 4px 0; padding: 4px 8px; white-space: normal; word-break: break-word; }
.task-shop { text-align: center; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
.tag-shop { background: #e3f2fd; color: #1565c0; }
.tag-status-done { background: #e8f5e9; color: #2e7d32; }
.tag-status-doing { background: #fff3e0; color: #e65100; }
.tag-status-todo { background: #f5f5f5; color: #757575; }
.tag-status-none { background: #fce4ec; color: #c62828; }
.tag-audit-pass { background: #e8f5e9; color: #2e7d32; }
.tag-audit-pending { background: #f5f5f5; color: #757575; }
.tag-audit-revise { background: #fff3e0; color: #e65100; }
.tag-level-key { background: #fce4ec; color: #c62828; }
.tag-level-normal { background: #e3f2fd; color: #1565c0; }
.task-deadline { text-align: center; color: #666; font-family: monospace; font-size: 12px; }
.task-deadline.overdue { color: #ea4335; font-weight: 600; }
.task-types { font-size: 11px; color: #888; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-header { display: grid; grid-template-columns: 100px 1fr 80px 90px 100px 110px; gap: 12px; padding: 9px 16px; background: #eef1f5; border-bottom: 2px solid #dde1e7; font-size: 12px; font-weight: 600; color: #777; position: sticky; top: 0; z-index: 20; }
.task-header .th-center { text-align: center; }
.empty-state { text-align: center; padding: 40px; color: #999; font-size: 14px; }
@media (max-width: 1200px) {
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .charts { grid-template-columns: 1fr; }
  .task-row { grid-template-columns: 80px 1fr 60px 80px 90px; }
  .task-header { grid-template-columns: 80px 1fr 60px 80px 90px; }
  .task-header .th-deadline { display: none; }
  .task-types { display: none; }
}
</style>
</head>

<div class="header">
  <h1>图片任务流转看板</h1>
  <div class="sub" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">

</div>
<div class="container">

  </div>
  <!-- 筛选区 -->
  <div class="filter-bar">
    <div class="filter-item" style="min-width:100%;">
      <label>⏰ 时间筛选（按图片任务截止时间）</label>
      <div class="quick-date-bar">
        <button class="quick-btn active" onclick="setQuickDate('all', this)">全部</button>
        <button class="quick-btn" onclick="setQuickDate('today', this)">今天</button>
        <button class="quick-btn" onclick="setQuickDate('week', this)">本周</button>
        <button class="quick-btn" onclick="setQuickDate('month', this)">本月</button>

        <span class="date-sep">|</span>
        <span class="date-custom">自定义：</span>
        <input type="date" id="f-date-start" value="2026-07-30" onchange="setQuickDate('custom', null)">
        <span class="date-sep">至</span>
        <input type="date" id="f-date-end" value="2026-10-30" onchange="setQuickDate('custom', null)">
      </div>
    </div>
    <div class="filter-item">
      <label>图片负责人</label>
      <select id="f-owner" multiple onchange="applyFilter()">
        <option value="凌大鑫">凌大鑫</option><option value="刘家乐">刘家乐</option><option value="叶龙">叶龙</option><option value="周益裕">周益裕</option><option value="杨舒婷">杨舒婷</option><option value="林计宏">林计宏</option><option value="莫梓晴">莫梓晴</option>
      </select>
    </div>
    <div class="filter-item">
      <label>视频拍摄负责人</label>
      <select id="f-video-owner" multiple onchange="applyFilter()"></select>
    </div>
    <div class="filter-item">
      <label>产品拍摄负责人</label>
      <select id="f-shoot-owner" multiple onchange="applyFilter()"></select>
    </div>
    <div class="filter-item">
      <label>拍摄状态</label>
      <select id="f-status" onchange="applyFilter()">
        <option value="">全部</option>
        <option value="不需要">不需要</option><option value="已完成">已完成</option>
      </select>
    </div>
    <div class="filter-item">
      <label>对应店铺</label>
      <select id="f-shop" onchange="applyFilter()">
        <option value="">全部</option>
        <option value="GS">GS</option><option value="MG">MG</option><option value="NL">NL</option><option value="SL">SL</option><option value="TK">TK</option><option value="TW">TW</option><option value="UF">UF</option>
      </select>
    </div>
    <div class="filter-item">
      <label>产品等级</label>
      <select id="f-level" onchange="applyFilter()">
        <option value="">全部</option>
        <option value="重点产品">重点产品</option>
        <option value="常规产品">常规产品</option>
      </select>
    </div>
    <button class="btn btn-default" onclick="resetFilter()">重置筛选</button>
    <div class="filter-count" id="filter-count"></div>
  </div>
  <!-- 任务列表（按负责人分组） -->
  <div class="task-section">
    <div class="task-section-title">全员任务总览 <span class="count" id="task-count"></span></div>
    <div class="task-header">
      <div>产品编号</div>
      <div>产品名称 / 拍摄负责人 / 附件 / 运营备注</div>
      <div class="th-center">对应店铺</div>
      <div class="th-center">拍摄状态</div>
      <div class="th-center">审核状态</div>
      <div class="th-center th-deadline">截止时间</div>
    </div>
    <div id="task-list"></div>
  </div>
  <!-- 图表区 -->
  <div class="charts">
    <div class="chart-card"><div class="chart-title">产品拍摄状态分布</div><div class="chart-container" id="chart-status"></div></div>
    <div class="chart-card"><div class="chart-title">终稿审核状态分布</div><div class="chart-container" id="chart-audit"></div></div>
    <div class="chart-card"><div class="chart-title">各店铺任务数量</div><div class="chart-container" id="chart-shop"></div></div>
    <div class="chart-card"><div class="chart-title">各负责人任务数</div><div class="chart-container" id="chart-owner"></div></div>
  </div>
</div>

function getStatusTag(status) {
  if (status === '已完成') return '<span class="tag tag-status-done">已完成</span>';
  if (status === '拍摄中') return '<span class="tag tag-status-doing">拍摄中</span>';
  if (status === '未开始') return '<span class="tag tag-status-todo">未开始</span>';
  if (status === '不需要') return '<span class="tag tag-status-none">不需要</span>';
  return '<span class="tag tag-status-todo">未填写</span>';
}
function getAuditTag(status) {
  if (status === '审核通过') return '<span class="tag tag-audit-pass">通过</span>';
  if (status === '需要修改') return '<span class="tag tag-audit-revise">需修改</span>';
  if (status === '未审核') return '<span class="tag tag-audit-pending">未审核</span>';
  return '<span class="tag tag-audit-pending">未填写</span>';
}
function getLevelTag(level) {
  if (level === '重点产品') return '<span class="tag tag-level-key">重点</span>';
  if (level === '常规产品') return '<span class="tag tag-level-normal">常规</span>';
  return '';
}

function setQuickDate(range, btn) {
  const today = new Date();
  const fmt = d => {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  };
  let start = '', end = '';
  if (range === 'all') { start = RAW_DATA.min_date; end = RAW_DATA.max_date; }
  else if (range === 'today') { start = fmt(today); end = fmt(today); }
  else if (range === 'week') {
    const day = today.getDay() || 7;
    const monday = new Date(today); monday.setDate(today.getDate() - day + 1);
    const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
    start = fmt(monday); end = fmt(sunday);
  }
  else if (range === 'month') {
    const first = new Date(today.getFullYear(), today.getMonth(), 1);
    const last = new Date(today.getFullYear(), today.getMonth() + 1, 0);
    start = fmt(first); end = fmt(last);
  }
  else if (range === '7days') {
    const d7 = new Date(today); d7.setDate(today.getDate() + 6);
    start = fmt(today); end = fmt(d7);
  }
  else if (range === '30days') {
    const d30 = new Date(today); d30.setDate(today.getDate() + 29);
    start = fmt(today); end = fmt(d30);
  }
  else if (range === 'custom') {
    start = document.getElementById('f-date-start').value;
    end = document.getElementById('f-date-end').value;
  }
  if (start) document.getElementById('f-date-start').value = start;
  if (end) document.getElementById('f-date-end').value = end;
  // 更新按钮active状态
  document.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  else if (range === 'custom') {
    // 自定义时不高亮任何快捷按钮
  }
  applyFilter();
}

function applyFilter() {
  const ds = document.getElementById('f-date-start').value;
  const de = document.getElementById('f-date-end').value;
  const ownerSel = document.getElementById('f-owner');
  const owners = Array.from(ownerSel.selectedOptions).map(o => o.value);
  const shootOwners = Array.from(document.getElementById('f-shoot-owner').selectedOptions).map(o => o.value);
  const videoOwners = Array.from(document.getElementById('f-video-owner').selectedOptions).map(o => o.value);
  const status = document.getElementById('f-status').value;
  const shop = document.getElementById('f-shop').value;
  const level = document.getElementById('f-level').value;

  filteredTasks = RAW_DATA.tasks.filter(t => {
    if (ds && t.deadline && t.deadline < ds) return false;
    if (de && t.deadline && t.deadline > de) return false;
    if (ds && !t.deadline) return false;
    if (owners.length > 0 && !t.pic_owners.some(o => owners.includes(o))) return false;
    if (shootOwners.length > 0 && !(t.shoot_owners||[]).some(o => shootOwners.includes(o))) return false;
    if (videoOwners.length > 0 && !(t.video_shoot_owners||[]).some(o => videoOwners.includes(o))) return false;
    if (status && t.shoot_status !== status) return false;
    if (shop && t.shop !== shop) return false;
    if (level && t.product_level !== level) return false;
    return true;
  });

  updateMetrics();
  updateCharts();
  updateTaskList();
}

function resetFilter() {
  document.getElementById('f-date-start').value = RAW_DATA.min_date;
  document.getElementById('f-date-end').value = RAW_DATA.max_date;
  document.getElementById('f-owner').selectedIndex = -1;
  Array.from(document.getElementById('f-owner').options).forEach(o => o.selected = false);
  ['f-shoot-owner','f-video-owner'].forEach(id => {
    const sel = document.getElementById(id);
    sel.selectedIndex = -1;
    Array.from(sel.options).forEach(o => o.selected = false);
  });
  document.getElementById('f-status').value = '';
  document.getElementById('f-shop').value = '';
  document.getElementById('f-level').value = '';
  document.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('active'));
  const allBtn = Array.from(document.querySelectorAll('.quick-btn')).find(b => b.textContent === '全部');
  if (allBtn) allBtn.classList.add('active');
  applyFilter();
}

function updateMetrics() {
  const total = filteredTasks.length;
  const done = filteredTasks.filter(t => t.shoot_status === '已完成').length;
  const pending = filteredTasks.filter(t => t.audit_status === '' || t.audit_status === '未审核').length;
  const rework = filteredTasks.filter(t => t.need_rework === '是').length;
  document.getElementById('m-total').textContent = total;
  document.getElementById('m-done').textContent = done;
  document.getElementById('m-pending').textContent = pending;
  document.getElementById('m-rework').textContent = rework;
  document.getElementById('filter-count').textContent = `筛选结果： ${total} 条`;
  document.getElementById('task-count').textContent = `共 ${total} 条任务`;
}

function countByField(tasks, field, multi=false) {
  const map = {};
  tasks.forEach(t => {
    if (multi) {
      (t[field] || []).forEach(v => map[v] = (map[v]||0)+1);
    } else {
      const v = t[field] || '未填写';
      map[v] = (map[v]||0)+1;
    }
  });
  return Object.entries(map).sort((a,b) => b[1]-a[1]);
}

function updateCharts() {
  const statusData = countByField(filteredTasks, 'shoot_status');
  charts.status.setOption({
    tooltip: {trigger:'item'},
    legend: {bottom:0, textStyle:{fontSize:11}},
    series: [{type:'pie', radius:['40%','65%'], center:['50%','45%'],
      label:{formatter:'{b}: {c} ({d}%)', fontSize:11},
      data: statusData.map(([name,value]) => ({name,value}))
    }]
  });

  const auditData = countByField(filteredTasks, 'audit_status');
  charts.audit.setOption({
    tooltip: {trigger:'item'},
    legend: {bottom:0, textStyle:{fontSize:11}},
    series: [{type:'pie', radius:['40%','65%'], center:['50%','45%'],
      label:{formatter:'{b}: {c} ({d}%)', fontSize:11},
      data: auditData.map(([name,value]) => ({name,value}))
    }]
  });

  const shopData = countByField(filteredTasks, 'shop');
  charts.shop.setOption({
    tooltip: {trigger:'axis'},
    grid: {left:40, right:20, top:20, bottom:30},
    xAxis: {type:'category', data: shopData.map(d=>d[0]), axisLabel:{fontSize:11}},
    yAxis: {type:'value', minInterval:1},
    series: [{type:'bar', data: shopData.map(d=>d[1]), barWidth:'50%',
      itemStyle:{color:'#1a73e8', borderRadius:[4,4,0,0]}}]
  });

  const ownerData = countByField(filteredTasks, 'pic_owners', true);
  charts.owner.setOption({
    tooltip: {trigger:'axis'},
    grid: {left:40, right:20, top:20, bottom:30},
    xAxis: {type:'category', data: ownerData.map(d=>d[0]), axisLabel:{fontSize:11, rotate: ownerData.length>5?30:0}},
    yAxis: {type:'value', minInterval:1},
    series: [{type:'bar', data: ownerData.map(d=>d[1]), barWidth:'50%',
      itemStyle:{color:'#34a853', borderRadius:[4,4,0,0]}}]
  });
}

function updateTaskList() {
  const container = document.getElementById('task-list');
  if (filteredTasks.length === 0) {
    container.innerHTML = '<div class="empty-state">没有符合筛选条件的任务</div>';
    return;
  }
  // 按负责人分组
  const groups = {};
  filteredTasks.forEach(t => {
    const owners = t.pic_owners.length > 0 ? t.pic_owners : ['未分配'];
    owners.forEach(o => {
      if (!groups[o]) groups[o] = [];
      groups[o].push(t);
    });
  });
  // 按任务数排序
  const sortedOwners = Object.entries(groups).sort((a,b) => b[1].length - a[1].length);

  let html = '';
  sortedOwners.forEach(([owner, tasks]) => {
    const avatar = owner.slice(0,1);
    const sorted = tasks.slice().sort((a,b) => (a.deadline||'9999') > (b.deadline||'9999') ? 1 : -1);
    html += `<div class="owner-group">
      <div class="owner-header" onclick="this.parentElement.classList.toggle('collapsed')">
        <div class="owner-avatar">${avatar}</div>
        <div class="owner-name">${owner}</div>
        <div class="owner-task-count">${tasks.length} 条任务</div>
        <div class="owner-toggle">▼</div>
      </div>
      <div class="owner-tasks">`;
    sorted.forEach(t => {
      const overdue = t.deadline && t.deadline < TODAY && t.shoot_status !== '已完成';
      const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      let meta = '';
      const shoot = (t.shoot_owners||[]).join('、');
      const video = (t.video_shoot_owners||[]).join('、');
      if (shoot) meta += `<span class="meta-chip shoot" title="产品拍摄负责人：${esc(shoot)}">产品拍摄 ${esc(shoot)}</span>`;
      if (video) meta += `<span class="meta-chip video" title="视频拍摄负责人：${esc(video)}">视频拍摄 ${esc(video)}</span>`;
      const IMG_EXT = ['png','jpg','jpeg','gif','webp','bmp'];
      let fileAtts = [], imgAtts = [];
      (t.attachments||[]).forEach(a => {
        if (typeof a === 'string') { meta += `<span class="meta-chip attach" title="附件：${esc(a)}">附件 ${esc(a)}</span>`; return; }
        (IMG_EXT.includes((a.ext||'').toLowerCase()) ? imgAtts : fileAtts).push(a);
      });
      fileAtts.forEach(a => { meta += `<a class="meta-chip attach" href="${esc(a.url)}" target="_blank" rel="noopener" title="点击打开/下载：${esc(a.name)}">附件 ${esc(a.name)}</a>`; });
      const thumbs = imgAtts.length ? `<div class="att-thumbs">${imgAtts.map(a=>`<a class="att-thumb" href="${esc(a.url)}" target="_blank" rel="noopener" title="${esc(a.name)}（点击打开原图）"><img loading="lazy" src="${esc(a.url)}" alt="${esc(a.name)}"></a>`).join('')}</div>` : '';
      const remark = t.op_remark ? `<div class="task-remark">运营备注：${esc(t.op_remark)}</div>` : '';
      html += `<div class="task-row">
        <div class="task-id">${t.product_id||'-'}</div>
        <div class="task-namecol">
          <div class="task-name" title="${esc(t.product_name)}">${t.product_name||'-'}</div>
          ${meta?`<div class="task-meta">${meta}</div>`:''}
          ${thumbs}
          ${remark}
        </div>
        <div class="task-shop"><span class="tag tag-shop">${t.shop||'-'}</span></div>
        <div>${getStatusTag(t.shoot_status)}</div>
        <div>${getAuditTag(t.audit_status)}</div>
        <div class="task-deadline ${overdue?'overdue':''}">${t.deadline||'未设置'}</div>
      </div>`;
    });
    html += '</div></div>';
  });
  container.innerHTML = html;
}

// 初始化（动态填充产品/视频拍摄负责人选项）
function fillMultiSelect(id, names) {
  const sel = document.getElementById(id);
  sel.innerHTML = names.map(n => `<option value="${n}">${n}</option>`).join('');
}
fillMultiSelect('f-shoot-owner', RAW_DATA.all_shoot_owners || []);
fillMultiSelect('f-video-owner', RAW_DATA.all_video_owners || []);
initCharts();
applyFilter();
</script>
